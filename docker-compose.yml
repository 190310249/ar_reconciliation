services:

  nginx:
    build:
      context: ./nginx

    container_name: nginx_cont

    ports:
      - "80:80"

    depends_on:
      - django

    restart: always

    networks:
      - ar-network

  django:
    build:
      context: .

    container_name: django_cont

    command: >
      sh -c "
      python manage.py migrate --no-input &&
      python manage.py collectstatic --no-input &&
      python scripts/load_dataset.py &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

    restart: always

    networks:
      - ar-network

    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:8000/admin || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery_worker:
    build:
      context: .

    container_name: celery_worker_cont

    command: >
      celery -A config worker -l info --concurrency=4

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - django
      - redis
      - db

    restart: always

    networks:
      - ar-network


  redis:
    image: redis:7-alpine

    container_name: redis_cont

    ports:
      - "6379:6379"

    restart: always

    networks:
      - ar-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine

    container_name: postgres_cont

    environment:
      POSTGRES_DB: ar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - ./data/postgres/db:/var/lib/postgresql/data

    restart: always

    networks:
      - ar-network

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U postgres"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  ar-network:

volumes:
  static_volume: